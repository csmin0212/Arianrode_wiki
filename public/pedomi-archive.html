<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페도미 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
:root{
  --ink:#070b14;
  --deep:#0b1120;
  --plate:#111a2e;
  --plate-2:#17223b;
  --line:#26344f;
  --line-2:#33456a;
  --paper:#e7edf8;
  --dim:#8496b5;
  --dim-2:#5f6f8d;
  --brass:#d8b44a;
  --frost:#8fdcff;
  --danger:#e2564a;
  --f-display:"Black Han Sans","Pretendard Variable",sans-serif;
  --f-body:"Pretendard Variable","Pretendard",system-ui,-apple-system,sans-serif;
  --f-tech:"Chakra Petch","Pretendard Variable",sans-serif;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--ink);color:var(--paper);font-family:var(--f-body);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ═══ 레이아웃 ═══ */
.app{display:grid;grid-template-columns:214px 1fr;height:100vh}
@media(max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}}

/* ── 좌측 분류 레일 ── */
.rail{
  background:linear-gradient(180deg,var(--deep),var(--ink));
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;
}
.brand{padding:18px 16px 14px;border-bottom:1px solid var(--line)}
.brand .logo{font-family:var(--f-display);font-size:20px;letter-spacing:-.01em;line-height:1}
.brand .sub{font-family:var(--f-tech);font-size:9px;letter-spacing:.3em;color:var(--frost);margin-top:6px}
.railscroll{flex:1;overflow-y:auto;padding:10px 8px 20px}

.grouplab{
  font-family:var(--f-tech);font-size:9.5px;letter-spacing:.28em;color:var(--dim-2);
  padding:14px 8px 6px;display:flex;align-items:center;gap:8px;
}
.grouplab::after{content:"";flex:1;height:1px;background:var(--line)}
.nav{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:7px 9px;border:0;background:transparent;color:var(--dim);
  border-radius:var(--r);cursor:pointer;text-align:left;font-size:13.5px;
  border-left:3px solid transparent;transition:background-color .13s,color .13s,border-color .13s;
}
.nav:hover{background:var(--plate);color:var(--paper)}
.nav.on{background:var(--plate-2);color:#fff;border-left-color:var(--c,var(--frost))}
.nav .dot{width:7px;height:7px;flex:none;background:var(--c,var(--dim-2));transform:rotate(45deg);opacity:.9}
.nav .n{flex:1}
.nav .cnt{font-family:var(--f-tech);font-size:11px;color:var(--dim-2)}
.nav.on .cnt{color:var(--c,var(--frost))}

/* ── 메인 ── */
main{display:flex;flex-direction:column;overflow:hidden;background:
  radial-gradient(900px 500px at 80% -10%, #142544 0%, transparent 60%),var(--ink)}
.topbar{
  display:flex;align-items:center;gap:10px;padding:14px 20px;
  border-bottom:1px solid var(--line);background:#0a1018;
  flex-wrap:wrap;
}
.crumb{font-family:var(--f-tech);font-size:11px;letter-spacing:.2em;color:var(--dim);flex:none}
.crumb b{color:var(--paper)}
.search{
  flex:1;min-width:130px;background:var(--plate);border:1px solid var(--line);
  border-radius:var(--r);padding:7px 11px;color:var(--paper);font-size:13px;outline:none;
}
.search:focus{border-color:var(--frost)}
.sortsel{
  flex:none;background:var(--plate);border:1px solid var(--line);border-radius:var(--r);
  padding:7px 9px;color:var(--dim);font-family:inherit;font-size:12.5px;outline:none;cursor:pointer;
}
.sortsel:hover{border-color:var(--frost);color:var(--frost)}
.sortsel:focus{border-color:var(--frost);color:var(--paper)}
.sortsel option{background:var(--plate);color:var(--paper)}
.search::placeholder{color:var(--dim-2)}
.btn{
  background:var(--plate);border:1px solid var(--line);color:var(--dim);
  padding:7px 13px;border-radius:var(--r);cursor:pointer;font-size:12.5px;
  transition:color .13s,border-color .13s,background-color .13s;white-space:nowrap;
}
.btn:hover{border-color:var(--frost);color:var(--frost)}
.btn.primary{background:linear-gradient(160deg,#f3dd93,var(--brass) 45%,#8f7420);border-color:#8f7420;color:#33270a;font-weight:700}
.btn.primary:hover{filter:brightness(1.1);color:#33270a}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}

.list{flex:1;overflow-y:auto;padding:16px 20px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px}

/* ── 페이지 넘김 ── */
.pager{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:20px}
.pager .pg{background:var(--plate);border:1px solid var(--line);color:var(--dim);
  min-width:34px;padding:7px 11px;border-radius:var(--r);cursor:pointer;font-size:13px;font-family:var(--f-tech)}
.pager .pg:hover:not(:disabled){border-color:var(--frost);color:var(--frost)}
.pager .pg.on{background:var(--plate-2);border-color:var(--frost);color:#fff}
.pager .pg:disabled{opacity:.38;cursor:default}
.pager .pg-gap{color:var(--dim-2);padding:0 2px}
.pager .pg-info{margin-left:auto;font-size:11px;color:var(--dim-2);font-family:var(--f-tech);letter-spacing:.08em}

/* ── 목록 카드 ── */
.item{
  display:flex;gap:0;background:var(--plate);border:1px solid var(--line);
  border-left:3px solid var(--c);border-radius:var(--r);overflow:hidden;
  cursor:pointer;transition:background-color .14s,border-color .14s;
  text-align:left;padding:0;color:inherit;font:inherit;
  contain:layout style paint;
}
.item:hover{background:var(--plate-2);border-color:var(--line-2);border-left-color:var(--c)}
.item .thumb{
  width:76px;flex:none;background:var(--plate-2);
  position:relative;overflow:hidden;
}
.item .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.item .thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim-2);font-size:19px}
.item .meat{flex:1;padding:10px 12px;min-width:0}
.item .top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.chip{
  font-family:var(--f-tech);font-size:9.5px;letter-spacing:.16em;padding:2px 7px;border-radius:2px;
  border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);
}
.tier{
  font-family:var(--f-tech);font-weight:700;font-size:11px;margin-left:auto;color:var(--brass);
  border:1px solid #6d5a1c;padding:1px 6px;border-radius:2px;
}
.item .nm{font-family:var(--f-display);font-size:16px;line-height:1.2;margin-bottom:7px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mini .set{display:flex;align-items:center;gap:3px}
.mini .sw{width:9px;height:9px;transform:rotate(45deg);flex:none}
.mini .v{font-family:var(--f-tech);font-size:11px;color:var(--dim);letter-spacing:.06em}
.tagline{margin-top:6px;font-size:11.5px;color:var(--dim-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{
  border:1px dashed var(--line);border-radius:var(--r);padding:44px 20px;text-align:center;color:var(--dim-2);
  grid-column:1/-1;
}
.empty b{display:block;color:var(--dim);font-size:15px;margin-bottom:6px;font-family:var(--f-body);font-weight:600}

/* ═══ 오버레이 ═══ */
.ov{position:fixed;inset:0;background:rgba(3,6,12,.90);
  display:none;z-index:40;overflow-y:auto;padding:26px 16px 60px}
.ov.open{display:block}
.panel{
  max-width:880px;margin:0 auto;background:#04070d;padding:9px;border-radius:6px;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
}
.panel-in{
  background:linear-gradient(180deg,var(--plate-2),var(--plate) 260px);
  border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:hidden;
}
.panel-in::before{
  content:"";position:absolute;inset:0 0 auto 0;height:200px;pointer-events:none;
  background:radial-gradient(600px 180px at 78% 0%, color-mix(in srgb,var(--c) 20%,transparent), transparent 70%);
}
.banner{
  position:absolute;top:0;right:20px;z-index:3;width:46px;padding:10px 0 22px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 45%,color-mix(in srgb,var(--c) 60%,#000));
  clip-path:polygon(0 0,100% 0,100% 100%,50% 88%,0 100%);text-align:center;
}
.banner span{writing-mode:vertical-rl;font-family:var(--f-display);font-size:16px;letter-spacing:.14em;color:#0a1018}

.d-head{padding:22px 24px 16px;position:relative;z-index:2}
.d-eyebrow{font-family:var(--f-tech);font-size:10px;letter-spacing:.3em;color:var(--c);display:flex;gap:9px;align-items:center}
.d-eyebrow::after{content:"";flex:1;max-width:150px;height:1px;background:var(--line)}
.d-name{font-family:var(--f-display);font-size:clamp(26px,5vw,38px);line-height:1.1;margin-top:8px;color:#fff}
.d-sub{font-family:var(--f-tech);font-size:11px;letter-spacing:.2em;color:var(--dim);margin-top:5px}

.d-body{display:grid;grid-template-columns:212px 1fr;gap:18px;padding:0 24px 22px;position:relative;z-index:2}
@media(max-width:700px){.d-body{grid-template-columns:1fr}}
.d-illust{aspect-ratio:5/7;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:var(--plate-2);position:relative;display:grid;place-items:center;color:var(--dim-2);font-size:12px}
.d-illust img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.facts{margin-top:12px;border-top:1px solid var(--line)}
.facts .r{display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.facts .k{font-family:var(--f-tech);font-size:10px;letter-spacing:.16em;color:var(--dim);width:52px;flex:none;padding-top:2px}
.facts .v{flex:1;line-height:1.6}

.sec{margin-bottom:20px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.sec-h h3{margin:0;font-size:13.5px;font-weight:700;letter-spacing:.04em}
.sec-h .t{font-family:var(--f-tech);font-size:9.5px;letter-spacing:.24em;color:var(--dim-2);
  border:1px solid var(--line);padding:2px 7px;border-radius:2px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* 덱 트랙 (시그니처) */
.stat{display:flex;align-items:center;gap:11px;padding:9px 11px;margin-bottom:7px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--sc) 11%,transparent),transparent 62%);
  border:1px solid var(--line);border-left:3px solid var(--sc);border-radius:var(--r)}
.stat .lab{font-family:var(--f-tech);font-size:10.5px;letter-spacing:.18em;color:var(--dim);width:52px;flex:none}
.trk{display:flex;gap:6px;flex-wrap:wrap}
.tok{width:31px;height:35px;display:grid;place-items:center;font-family:var(--f-tech);font-weight:700;font-size:15px;
  color:var(--sc);border:1px solid var(--sc);background:color-mix(in srgb,var(--sc) 10%,transparent);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.checks{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.ck{font-size:12.5px;border:1px solid var(--line);background:var(--plate-2);
  padding:5px 11px;border-radius:2px;color:var(--dim)}
.ck b{color:var(--frost);font-family:var(--f-tech);margin-left:5px}

/* 스킬 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:10px}
.sk{background:var(--plate-2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.sk .tg{display:flex;gap:4px;padding:7px 8px 0;flex-wrap:wrap}
.pill{font-family:var(--f-tech);font-size:9.5px;letter-spacing:.12em;padding:2px 7px;border-radius:2px;
  border:1px solid var(--pc,#5c352d);background:color-mix(in srgb,var(--pc,#e2564a) 15%,transparent);color:var(--pc,#ffb4a8)}
.sk .snm{font-family:var(--f-display);font-size:15px;padding:6px 9px 7px;border-bottom:1px solid var(--line)}
.sk .nums{display:flex;gap:7px;padding:8px 9px;border-bottom:1px solid var(--line)}
.badge{display:flex;align-items:center;gap:5px;font-family:var(--f-tech);font-weight:700;font-size:14px;
  padding:2px 8px;border-radius:2px;border:1px solid var(--bc);color:var(--bc);
  background:color-mix(in srgb,var(--bc) 12%,transparent)}
.badge svg{width:12px;height:12px}
.sk .eff{padding:8px 9px;font-size:12px;line-height:1.72;color:#c0cee6;flex:1;white-space:pre-wrap}
.sk .eff kw{color:var(--frost);font-weight:700}

.prose{font-size:13.5px;line-height:1.9;color:#cbd7ea;white-space:pre-wrap}
.synergy{display:flex;flex-direction:column;gap:7px}
.syn{border:1px solid var(--line);border-left:2px solid var(--brass);background:var(--plate-2);
  border-radius:var(--r);padding:9px 12px;display:block;width:100%;text-align:left;
  font-family:inherit;color:inherit}
.syn .sn{font-weight:700;font-size:13.5px;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.syn .sd{font-size:12.5px;line-height:1.75;color:var(--dim);white-space:pre-wrap}
button.syn{cursor:pointer;border-left-color:var(--lc);transition:.14s}
button.syn:hover{background:var(--plate);border-color:var(--line-2);border-left-color:var(--lc);
  transform:translateX(2px)}
button.syn:hover .go{color:var(--lc);border-color:var(--lc)}
.go{font-family:var(--f-tech);font-size:9.5px;letter-spacing:.14em;color:var(--dim-2);
  border:1px solid var(--line);padding:1px 7px;border-radius:2px;font-weight:500;transition:.14s}
.miss{font-family:var(--f-tech);font-size:9.5px;letter-spacing:.14em;color:var(--dim-2);
  border:1px dashed var(--line);padding:1px 7px;border-radius:2px;font-weight:500}
.mk{background:transparent;border:0;color:var(--frost);cursor:pointer;font-size:11.5px;
  padding:1px 4px;margin-left:auto;opacity:.75}
.mk:hover{opacity:1;text-decoration:underline}
.backs{display:flex;gap:7px;flex-wrap:wrap}
.back-chip{
  display:flex;align-items:center;gap:7px;background:var(--plate-2);border:1px solid var(--line);
  border-left:2px solid var(--lc);border-radius:var(--r);padding:7px 12px;cursor:pointer;
  color:var(--paper);font:inherit;font-size:13px;transition:.14s;
}
.back-chip:hover{background:var(--plate);border-color:var(--line-2);border-left-color:var(--lc)}
.back-chip i{font-family:var(--f-tech);font-size:9.5px;letter-spacing:.14em;color:var(--lc);font-style:normal}

.d-foot{display:flex;gap:8px;padding:14px 24px;border-top:1px solid var(--line);
  background:rgba(4,7,13,.5);position:relative;z-index:2;flex-wrap:wrap}
.d-foot .sp{flex:1}

/* ═══ 편집 폼 ═══ */
.form{padding:20px 24px 8px;position:relative;z-index:2}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:11px}
label{display:block;font-family:var(--f-tech);font-size:9.5px;letter-spacing:.2em;color:var(--dim);margin-bottom:5px}
input[type=text],select,textarea{
  width:100%;background:var(--plate);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 10px;color:var(--paper);font-family:var(--f-body);font-size:13.5px;outline:none;transition:.12s;
}
textarea{resize:vertical;min-height:74px;line-height:1.7}
input:focus,select:focus,textarea:focus{border-color:var(--frost);background:var(--plate-2)}
.hint{font-size:11px;color:var(--dim-2);margin-top:4px}
.blockhead{display:flex;align-items:center;gap:9px;margin:18px 0 10px}
.blockhead h4{margin:0;font-size:12.5px;letter-spacing:.04em}
.blockhead::after{content:"";flex:1;height:1px;background:var(--line)}
.repeat{border:1px solid var(--line);border-radius:var(--r);padding:11px;margin-bottom:9px;background:var(--plate)}
.repeat .rh{display:flex;justify-content:flex-end;margin-bottom:-4px}
.x{background:transparent;border:0;color:var(--dim-2);cursor:pointer;font-size:15px;line-height:1;padding:2px 5px}
.x:hover{color:var(--danger)}
.dropzone{aspect-ratio:5/7;border:1px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;
  text-align:center;color:var(--dim-2);font-size:12px;line-height:1.7;cursor:pointer;position:relative;overflow:hidden;
  background:var(--plate)}
.dropzone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dropzone.hot{border-color:var(--frost);color:var(--frost)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--plate-2);border:1px solid var(--line-2);color:var(--paper);
  padding:10px 18px;border-radius:var(--r);font-size:13px;z-index:90;opacity:0;
  transition:.2s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
:focus-visible{outline:2px solid var(--frost);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<svg style="display:none">
  <symbol id="i-cost" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.6"/><circle cx="12" cy="12" r="3" fill="currentColor"/></symbol>
  <symbol id="i-pow" viewBox="0 0 24 24"><path fill="currentColor" d="M21 2l-9.5 9.5 2.5 2.5L23.5 4.5 21 2zM8.5 14L2 20.5 3.5 22 10 15.5 8.5 14z"/></symbol>
</svg>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="logo">페도미 아카이브</div>
      <div class="sub">SERVANT / MASTER</div>
    </div>
    <div class="railscroll" id="rail"></div>
  </aside>

  <main>
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <input class="search" id="q" type="text" placeholder="이름 · 스킬 · 태그 검색">
      <select class="sortsel" id="sort" title="정렬 기준">
        <option value="default">기본순 (등록순)</option>
        <option value="name">이름순 (가나다)</option>
        <option value="name_desc">이름 역순</option>
        <option value="class">클래스순</option>
        <option value="rank">랭크 높은순</option>
        <option value="rank_asc">랭크 낮은순</option>
        <option value="reviews">평가 많은순</option>
      </select>
      <button class="btn" onclick="exportJSON()">내보내기</button>
      <button class="btn" onclick="document.getElementById('imp').click()">가져오기</button>
      <input type="file" id="imp" accept="application/json" hidden onchange="importJSON(this)">
      <button class="btn primary" onclick="openEditor(null)">＋ 새 항목</button>
    </div>
    <div class="list"><div class="grid" id="grid"></div></div>
  </main>
</div>

<div class="ov" id="detail" onclick="if(event.target===this)closeDetail()"></div>
<div class="ov" id="editor" onclick="if(event.target===this)closeEditor()"></div>
<div class="toast" id="toast"></div>

<style>
/* ── 공용 리뷰(평점·댓글) 패널 ── */
.reviews{margin-top:20px;border-top:1px solid var(--line);padding:18px 24px 4px;position:relative;z-index:2}
@media(max-width:700px){.reviews{padding:18px 16px 4px}}
.reviews .rv-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.reviews .rv-h h3{margin:0;font-family:var(--f-tech);font-size:14px;letter-spacing:.14em;color:var(--paper)}
.reviews .rv-h .t{font-family:var(--f-tech);font-size:10px;letter-spacing:.24em;color:var(--dim-2)}
.reviews .rv-avg{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--dim)}
.reviews .rv-avg b{font-family:var(--f-tech);font-size:16px;color:var(--brass)}
.rv-list{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}

<script>
/* ══════════ 공용 저장소 (Vercel Redis 백엔드) ══════════
   모든 방문자가 같은 아카이브 DB를 공유하도록 window.storage 를
   /api/archive 엔드포인트에 연결한다. 실패 시 localStorage 로 폴백. */
(function(){
  const API = "/api/archive";
  const local = {
    get: async (k) => { try { return { value: localStorage.getItem(k) }; } catch { return { value:null }; } },
    set: async (k,v) => { try { localStorage.setItem(k,v); } catch {} },
  };
  window.storage = {
    async get(k){
      try{
        const r = await fetch(API, { cache:"no-store" });
        const d = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
        window.__storageOffline = null;
        return { value: d.value ?? null };
      }catch(e){
        // 서버 연결 실패 → 로컬 백업본이라도 보여주되, 오프라인임을 기록한다
        window.__storageOffline = (e && e.message) ? e.message : "서버에 연결할 수 없습니다";
        return local.get(k);
      }
    },
    async set(k,v){
      const r = await fetch(API, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ value: v }),
      });
      if(!r.ok){
        let msg = `서버 저장 실패 (HTTP ${r.status}, ${Math.round(v.length/1024)}KB 전송)`;
        try{ const d = await r.json(); if(d && d.error) msg = d.error; }catch{}
        throw new Error(msg);
      }
    },
  };
})();

/* ══════════ 평균 평점 → 랭크 ══════════
   방문자들이 남긴 별점의 평균으로 랭크(SS~F)를 자동 산출한다.
   전체 평균은 /api/reviews (skillId 없이) 한 번의 요청으로 모두 받아온다. */
const RATINGS_KEY = "pedomi-ratings-cache";
let RATINGS = {};   // { 카드id: {avg, count} }

const RANKS = [
  [4.5, "SS", "#ffd76a"],
  [4.0, "S",  "#f0b429"],
  [3.5, "A",  "#5fd6dd"],
  [3.0, "B",  "#3ec98a"],
  [2.5, "C",  "#8fb0d8"],
  [2.0, "D",  "#9aa6bb"],
  [1.5, "E",  "#c08a6a"],
  [0,   "F",  "#d15a5a"],
];
function rankOf(avg){
  for(const [min, label, color] of RANKS){ if(avg >= min) return {label, color}; }
  return {label:"F", color:"#d15a5a"};
}
const ratingOf = (cardId) => RATINGS[cardId] || null;

/* 랭크 배지 HTML (목록용) — 평가가 없으면 배지를 숨긴다 */
function rankBadge(cardId){
  const r = ratingOf(cardId);
  if(!r || !r.count) return "";
  const k = rankOf(r.avg);
  return `<span class="tier rank" style="--rc:${k.color}" title="평균 ${r.avg} · ${r.count}명">${k.label}</span>`;
}

/* 랭크 표시 HTML (상세용) — 평균 평점과 참여 인원을 함께 보여준다 */
function rankRow(cardId){
  const r = ratingOf(cardId);
  if(!r || !r.count){
    return `<div class="rankbox"><span class="meta">아직 평가 없음</span></div>`;
  }
  const k = rankOf(r.avg);
  return `<div class="rankbox" style="--rc:${k.color}">
    <span class="rk">${k.label}</span>
    <span class="meta">★ ${r.avg} · ${r.count}명</span></div>`;
}

/* ── 리뷰 본문까지 통째로 캐시 ──
   카드를 열 때마다 요청하면 매번 서버 왕복이 생긴다. 서버는 어차피 전체
   리뷰를 읽으므로, 시작할 때 pedomi 네임스페이스 전체를 1회만 받아 캐시한다.
   → 카드 열기는 네트워크 요청 0회, 즉시 표시. */
const REVIEWS_KEY = "pedomi-reviews-cache";
let REVIEWS = {};          // { 카드id: [리뷰...] }
let reviewsReady = false;  // 서버 응답을 받았는가
const reviewSubs = new Set();   // 캐시 갱신 시 다시 그릴 콜백

const reviewsOf = (cardId) => REVIEWS[cardId] || [];
function onReviewsUpdate(fn){ reviewSubs.add(fn); return () => reviewSubs.delete(fn); }

function applyReviewCache(byId, agg){
  REVIEWS = byId || {};
  const next = {};
  for(const id in (agg||{})) next[id] = { avg: agg[id].avgRating, count: agg[id].count };
  RATINGS = next;
  try{
    localStorage.setItem(RATINGS_KEY, JSON.stringify(next));
    localStorage.setItem(REVIEWS_KEY, JSON.stringify(byId||{}));
  }catch(e){}
  if(typeof renderGrid === "function") renderGrid();
  reviewSubs.forEach(fn=>{ try{ fn(); }catch(e){} });
}

async function loadReviews(){
  // 1) 로컬 캐시로 즉시 표시 (첫 페인트에 네트워크를 기다리지 않는다)
  try{
    const a = localStorage.getItem(RATINGS_KEY);
    const b = localStorage.getItem(REVIEWS_KEY);
    if(a) RATINGS = JSON.parse(a) || {};
    if(b) REVIEWS = JSON.parse(b) || {};
  }catch(e){}

  // 2) 서버에서 pedomi 리뷰 전체를 1회 요청 → 이후 카드 열기는 전부 캐시 히트
  try{
    const r = await fetch("/api/reviews?prefix=pedomi%3A", { cache:"no-store" });
    if(!r.ok) return;
    const d = await r.json();
    applyReviewCache(d.byId, d.aggregates);
  }catch(e){}
  finally{ reviewsReady = true; reviewSubs.forEach(fn=>{ try{ fn(); }catch(e){} }); }
}

/* ══════════ 공용 평점 · 댓글 모듈 ══════════
   각 카드(서번트/마스터)에 대해 방문자들이 별점과 댓글을 남긴다.
   기존 /api/reviews 를 skillId = "pedomi:<카드id>" 네임스페이스로 재사용. */
(function(){
  const API = "/api/reviews";
  const key = (id) => "pedomi:" + id;
  const escR = (s) => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const when = (iso) => { try{ const d=new Date(iso); return d.toLocaleDateString("ko-KR",{year:"numeric",month:"short",day:"numeric"})+" "+d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}); }catch{ return ""; } };
  const starRow = (v, pick) =>
    `<span class="stars${pick?" pick":""}">`+
    [1,2,3,4,5].map(n=>`<span class="s${n<=v?" on":""}"${pick?` data-n="${n}"`:""}>★</span>`).join("")+
    `</span>`;

  // 상세뷰가 열릴 때 openDetail() 에서 호출됨
  window.mountReviews = async function(e){
    const panelIn = document.querySelector("#detail .panel-in");
    if(!panelIn) return;
    const foot = panelIn.querySelector(".d-foot");
    const sec = document.createElement("div");
    sec.className = "reviews";
    sec.innerHTML = `
      <div class="rv-h">
        <h3>평가 · 댓글</h3><span class="t">COMMUNITY</span>
        <span class="rv-avg" id="rvAvg"></span>
      </div>
      <div class="rv-list" id="rvList"><div class="rv-empty">불러오는 중…</div></div>
      <div class="rv-form">
        <div class="fr">
          <div><label>닉네임 (선택)</label><input id="rvName" maxlength="24" placeholder="익명"></div>
          <div><label>삭제용 비밀번호 (선택)</label><input id="rvPw" type="password" maxlength="40" placeholder="본인 댓글 삭제 시 필요"></div>
        </div>
        <div style="margin-bottom:9px">
          <label>평점</label>${starRow(0, true)}
        </div>
        <div style="margin-bottom:10px">
          <label>댓글</label><textarea id="rvComment" maxlength="1000" placeholder="이 카드에 대한 평가를 남겨주세요"></textarea>
        </div>
        <div class="act">
          <span class="err" id="rvErr"></span>
          <span class="sp"></span>
          <button class="btn primary" id="rvSubmit">등록</button>
        </div>
      </div>`;
    if(foot) panelIn.insertBefore(sec, foot); else panelIn.appendChild(sec);

    // 별점 선택 상태
    let picked = 0;
    const pickEl = sec.querySelector(".stars.pick");
    const paint = (v) => pickEl.querySelectorAll(".s").forEach((s,i)=>s.classList.toggle("on", i < v));
    pickEl.querySelectorAll(".s").forEach(s=>{
      s.addEventListener("click", ()=>{ picked = +s.dataset.n; paint(picked); });
      s.addEventListener("mouseenter", ()=>paint(+s.dataset.n));
    });
    pickEl.addEventListener("mouseleave", ()=>paint(picked));

    const listEl = sec.querySelector("#rvList");
    const avgEl = sec.querySelector("#rvAvg");
    const errEl = sec.querySelector("#rvErr");

    /* 캐시에서 즉시 그린다 — 카드를 열 때 네트워크를 기다리지 않는다 */
    function paintList(){
      const rv = reviewsOf(e.id);
      const r = ratingOf(e.id);
      avgEl.innerHTML = (r && r.count)
        ? `${starRow(Math.round(r.avg))} <b>${r.avg}</b> · ${r.count}개` : "";

      const rb = document.querySelector("#detail .rankbox");
      if(rb) rb.outerHTML = rankRow(e.id);

      if(!rv.length){
        listEl.innerHTML = reviewsReady
          ? `<div class="rv-empty">아직 평가가 없습니다. 첫 평가를 남겨보세요.</div>`
          : `<div class="rv-empty">불러오는 중…</div>`;
        return;
      }
      listEl.innerHTML = rv.map(x=>`
        <div class="rv-item">
          <div class="top">
            <span class="who">${escR(x.authorName||"익명")}</span>
            ${starRow(x.rating)}
            <span class="when">${when(x.createdAt)}</span>
            <button class="del" data-id="${x.id}" title="삭제">✕</button>
          </div>
          <div class="body">${escR(x.comment)}</div>
        </div>`).join("");
      listEl.querySelectorAll(".del").forEach(btn=>{
        btn.addEventListener("click", ()=>del(btn.dataset.id));
      });
    }
    paintList();

    // 최초 로드가 아직이면, 캐시가 채워질 때 자동으로 다시 그린다
    const unsub = onReviewsUpdate(()=>{
      if(!sec.isConnected){ unsub(); return; }
      paintList();
    });

    async function del(id){
      const pw = prompt("이 댓글의 삭제용 비밀번호를 입력하세요. (비밀번호 없이 등록된 댓글은 그냥 확인)");
      if(pw === null) return;
      try{
        const r = await fetch(`${API}?id=${encodeURIComponent(id)}`, {
          method:"DELETE",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ password: pw }),
        });
        const d = await r.json();
        if(!r.ok){ alert(d.error || "삭제하지 못했습니다."); return; }
        // 낙관적 반영 후 서버와 재동기화
        REVIEWS[e.id] = reviewsOf(e.id).filter(x=>x.id!==id);
        recalcLocal(e.id); paintList();
        loadReviews();
      }catch{ alert("삭제 중 오류가 발생했습니다."); }
    }

    /* 로컬 캐시만으로 평균을 다시 계산 (서버 응답 전 즉시 반영용) */
    function recalcLocal(id){
      const rv = reviewsOf(id);
      if(!rv.length) delete RATINGS[id];
      else RATINGS[id] = {
        avg: Math.round((rv.reduce((s,x)=>s+x.rating,0)/rv.length)*10)/10,
        count: rv.length,
      };
      try{ localStorage.setItem(RATINGS_KEY, JSON.stringify(RATINGS)); }catch(err){}
      if(typeof renderGrid === "function") renderGrid();
    }

    const submit = sec.querySelector("#rvSubmit");
    submit.addEventListener("click", async ()=>{
      errEl.textContent = "";
      const comment = sec.querySelector("#rvComment").value.trim();
      if(picked === 0){ errEl.textContent = "별점을 선택해 주세요."; return; }
      if(!comment){ errEl.textContent = "댓글을 입력해 주세요."; return; }
      submit.disabled = true; submit.textContent = "등록 중…";
      try{
        const r = await fetch(API, {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({
            skillId: key(e.id),
            authorName: sec.querySelector("#rvName").value.trim(),
            password: sec.querySelector("#rvPw").value.trim(),
            rating: picked,
            comment,
          }),
        });
        const d = await r.json();
        if(!r.ok){ errEl.textContent = d.error || "등록하지 못했습니다."; return; }

        // 낙관적 반영 — 서버 응답을 기다리지 않고 즉시 목록에 추가
        const mine = d.review || {
          id: "tmp"+Date.now(), authorName: sec.querySelector("#rvName").value.trim()||"익명",
          rating: picked, comment, createdAt: new Date().toISOString(),
        };
        REVIEWS[e.id] = [mine, ...reviewsOf(e.id)];
        recalcLocal(e.id);

        sec.querySelector("#rvComment").value = "";
        sec.querySelector("#rvPw").value = "";
        picked = 0; paint(0);
        paintList();
        loadReviews();   // 백그라운드 재동기화
      }catch{ errEl.textContent = "등록 중 오류가 발생했습니다."; }
      finally{ submit.disabled = false; submit.textContent = "등록"; }
    });
  };
})();
</script>

<script>
/* ══════════ 상수 ══════════ */
const CLASSES = ["세이버","아처","랜서","라이더","캐스터","어새신","버서커",
                 "룰러","어벤져","얼터에고","문캔서","포리너","프리텐더","실더","비스트"];

};
const STATS = [["근력","#e2453c"],["민첩","#3ad684"],["마술","#4aa8ff"]];
const TAGCOLOR = {"근력":"#e2564a","민첩":"#3ad684","마술":"#4aa8ff","특수":"#9aa6bb","보구":"#d8b44a","잔류":"#a86ff0"};

const KEY = "pedomi-archive";

/* ══════════ 시드 데이터 ══════════ */
const SEED = [{
  id:"s1", type:"서번트", cls:"라이더", name:"도브리냐 니키티치", reading:"DOBRYNYA NIKITICH",
  tier:"", align:"질서 · 선", origin:"루스 브일리나", illust:"",
  deck:{"근력":"2,2,3,3,4","민첩":"2,3","마술":"2"}, checks:"행운 x2, 급행 x2",
  skills:[
    {name:"즈메이 고리니치", tags:"근력, 보구", cost:"7", power:"4",
     text:"상시: 원한다면 이 카드의 [전투:] 능력을 3번까지 활용할 수 있다. 라운드 동안 3번 활용했다면 진명 개방하고 스킬 존의 [벨자 다마스크]를 사용된 카드에 추가한다.\n전투: 자신의 활성화된 기본 공격카드 1장의 파워만큼 전투 상대 1명의 합계파워에 −하고, 그 카드를 비활성화한다."},

function applyExactSkillTexts(){
  SEED.forEach(entry=>{
    const exact = EXACT_SKILL_TEXT[entry.name];
    if(!exact) return;
    entry.skills ||= [];
    Object.entries(exact).forEach(([name,text])=>{
      let skill = entry.skills.find(s=>s.name===name);
      if(!skill){
        skill = {name, tags:"", cost:"", power:"", text:""};
        entry.skills.push(skill);
      }
      skill.text = text;
      if(name==="세이버 클래스") skill.tags = skill.tags || "마술, 특수";
      if(name==="얼터에고 클래스") skill.tags = skill.tags || "잔류, 특수";
    });
  });
}

function applyDeckData(){
  SEED.forEach(entry=>{
    const data = SABER_DECK_DATA[entry.name] || LANCER_DECK_DATA[entry.name] || ARCHER_DECK_DATA[entry.name] || RIDER_DECK_DATA[entry.name] || CASTER_DECK_DATA[entry.name] || ASSASSIN_DECK_DATA[entry.name] || BERSERKER_DECK_DATA[entry.name] || EXTRA_DECK_DATA[entry.name];
    if(data){
      entry.deck = data.deck;
      entry.checks = data.checks;
    }
    if(entry.type==="서번트" && !String(entry.id||"").startsWith("custom_") && OFFICIAL_SERVANT_CLASSES.has(entry.cls)){
      entry.memo = "공식 서번트";
    }
  });
}

let DB = [];

const PAGE_SIZE = 48;
const SORT_KEY = "pedomi-sort";

const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const norm = s => String(s??"").replace(/\s+/g,"").toLowerCase();

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1900); }
function kw(t){ let h=esc(t); KW.forEach(k=>{ h=h.replace(new RegExp(k+":","g"), "<kw>"+k+":</kw>"); }); return h; }

/* 기본 일러스트 채우기 — 서버 데이터에도 적용한다.
   이미 이미지가 있는 카드(직접 올린 것 포함)는 건드리지 않는다. */
function fillCardImages(){
  if(typeof CARD_IMAGES === "undefined" || !Array.isArray(DB)) return;
  DB.forEach(e=>{
    if(!e) return;
    // 기본 이미지가 빠진 카드는 채운다
    if(!e.illust && CARD_IMAGES[e.id]){ e.illust = CARD_IMAGES[e.id]; return; }
    // 예전에 넣었다가 없어진 기본 이미지는 정리한다 (직접 올린 이미지는 건드리지 않는다)
    if(typeof e.illust === "string" && e.illust.startsWith("/cards/") && CARD_IMAGES[e.id] !== e.illust){
      e.illust = CARD_IMAGES[e.id] || "";
    }
  });
}

/* ══════════ 저장 ══════════ */
async function load(){
  // 1) 로컬 캐시가 있으면 먼저 즉시 렌더 → 반복 방문 시 체감 속도 대폭 개선
  let hasLocal = false;
  try{
    const cached = localStorage.getItem(KEY);
    if(cached){
      const p = JSON.parse(cached);
      if(Array.isArray(p) && p.length){ DB = p; hasLocal = true; fillCardImages(); render(); }
    }
  }catch(e){}

  // 2) 서버 최신본으로 동기화 (수정/삭제가 그대로 반영됨 — SEED 재주입하지 않음)
  try{
    const r = await window.storage.get(KEY);
    if(r && r.value){
      // 서버가 문자열 대신 배열을 돌려주는 경우도 받아준다.
      // (Upstash가 JSON 문자열을 자동 파싱해 버리는 일이 있다)
      const parsed = typeof r.value === "string" ? JSON.parse(r.value) : r.value;
      if(Array.isArray(parsed) && parsed.length){
        const json = JSON.stringify(parsed);
        const changed = !hasLocal || JSON.stringify(DB) !== json;
        DB = parsed;
        fillCardImages();
        try{ localStorage.setItem(KEY, json); }catch(e){}
        if(changed) render();
        return;
      }
    }
    // 서버에 못 닿은 경우: '비어 있음'과 구분해야 한다.
    // 여기서 시드를 저장하려 들면 실패 알림만 반복되고, 최악의 경우 덮어쓰기가 된다.
    if(window.__storageOffline){
      if(!hasLocal){ DB = cloneSeed(); render(); }
      warnOffline();
      return;
    }
    // 서버가 정말 비어 있음 → SEED로 최초 1회 시드하고 서버에 저장
    if(!hasLocal){ DB = cloneSeed(); render(); }
    await save();
  }catch(e){
    if(!hasLocal && (!Array.isArray(DB) || !DB.length)){ DB = cloneSeed(); render(); }
    warnOffline();
  }
}

/* 서버에 못 닿을 때 한 번만 알린다 — 편집해도 공유되지 않는 상태임을 미리 알려준다 */
let offlineWarned = false;
function warnOffline(){
  if(offlineWarned || !window.__storageOffline) return;
  offlineWarned = true;
  const msg = window.__storageOffline;
  toast("서버에 연결할 수 없습니다 — 지금 편집해도 공유되지 않습니다");
  console.warn("[아카이브] 저장소 연결 실패:", msg, "\n/api/health 에서 원인을 확인하세요.");
}
const cloneSeed = (value=SEED) => JSON.parse(JSON.stringify(value));
function mergeSeed(rows){
  if(!Array.isArray(rows)) return cloneSeed();
  const seedRows = cloneSeed();
  const seedById = new Map(seedRows.map(e=>[e.id,e]));
  rows.forEach(row=>{
    const seed = row && seedById.get(row.id);
    if(seed) syncSeedSkills(row, seed);
  });
  const seen = new Set(rows.map(e=>e&&e.id).filter(Boolean));
  seedRows.forEach(e=>{ if(!seen.has(e.id)) rows.push(e); });
  return rows;
}
function syncSeedSkills(row, seed){
  if(seed.deck) row.deck = cloneSeed(seed.deck);
  if(seed.checks !== undefined) row.checks = seed.checks;
  if(seed.memo !== undefined) row.memo = seed.memo;
  if(seed.synergy && !(row.synergy||[]).some(x=>x&&x.name&&x.text)) row.synergy = cloneSeed(seed.synergy);
  if(seed.review && !row.review) row.review = seed.review;
  if(String(seed.id||"").startsWith("custom_")){
    ["type","cls","name","reading","tier","align","origin"].forEach(k=>{
      if(seed[k] !== undefined) row[k] = seed[k];
    });
    row.skills = cloneSeed(seed.skills||[]);
    row.synergy = cloneSeed(seed.synergy||[]);
    row.review = seed.review || "";
    return;
  }
  row.skills ||= [];
  (seed.skills||[]).forEach(src=>{
    let dst = row.skills.find(s=>s.name===src.name);
    if(!dst){
      dst = {name:src.name, tags:src.tags||"", cost:src.cost||"", power:src.power||"", text:""};
      row.skills.push(dst);
    }
    dst.tags = src.tags || dst.tags || "";
    dst.cost = src.cost ?? dst.cost ?? "";
    dst.power = src.power ?? dst.power ?? "";
    dst.text = src.text || dst.text || "";
  });
}
async function save(){
  // 카드 안에 base64 이미지가 남아 있으면 먼저 분리한다.
  // (이미지를 DB blob에 넣으면 저장할 때마다 함께 전송되어 요청 크기 한도를 넘는다)
  try{ await migrateInlineImages(); }catch(e){}

  const json = JSON.stringify(DB);
  // 로컬 캐시를 먼저 갱신해 두면 새로고침해도 방금 작업이 남는다
  try{ localStorage.setItem(KEY, json); }catch(e){}
  try{ await window.storage.set(KEY, json); }
  catch(e){
    // 서버 저장이 실패하면 내 브라우저에만 남는다 = 다른 사람에게는 보이지 않는다.
    // 토스트로만 알리면 저장된 줄 알기 쉬우므로 분명하게 알린다.
    alert("서버 저장에 실패했습니다.\n" + ((e && e.message) ? e.message : "") +
      "\n\n변경 내용이 이 브라우저에만 남아 있어, 다른 사람에게는 보이지 않습니다." +
      "\n'내보내기'로 백업해 두시고 잠시 후 다시 시도해 주세요.");
  }
}

function filtered(){
  const q = UI.q.trim().toLowerCase();
  const rows = DB.filter(e=>{
    if(UI.type!=="all" && e.type!==UI.type) return false;
    if(UI.cls && e.cls!==UI.cls) return false;
    if(!q) return true;
    const hay = [e.name,e.reading,e.cls,e.align,e.origin,e.review,e.memo,
      (e.skills||[]).map(s=>s.name+" "+s.tags+" "+s.text).join(" "),
      (e.synergy||[]).map(s=>s.name+" "+s.text).join(" ")].join(" ").toLowerCase();
    return hay.includes(q);
  });
  return sortRows(rows);
}

/* ══════════ 정렬 ══════════ */
function sortRows(rows){
  const byName = (a,b) => String(a.name||"").localeCompare(String(b.name||""), "ko");
  // 클래스 정렬 순서: 마스터 먼저, 그다음 CLASSES 배열 순서
  const clsIndex = e => e.type==="마스터" ? -1 : (CLASSES.indexOf(e.cls) === -1 ? 999 : CLASSES.indexOf(e.cls));
  // 평가가 없는 항목은 항상 뒤로 보낸다
  const rate = e => ratingOf(e.id);

  switch(UI.sort){
    case "name":      return rows.sort(byName);
    case "name_desc": return rows.sort((a,b)=>byName(b,a));

    case "class":
      return rows.sort((a,b)=> clsIndex(a)-clsIndex(b) || byName(a,b));

    case "rank":
      return rows.sort((a,b)=>{
        const ra=rate(a), rb=rate(b);
        if(!ra && !rb) return byName(a,b);
        if(!ra) return 1;
        if(!rb) return -1;
        return rb.avg-ra.avg || rb.count-ra.count || byName(a,b);
      });

    case "rank_asc":
      return rows.sort((a,b)=>{
        const ra=rate(a), rb=rate(b);
        if(!ra && !rb) return byName(a,b);
        if(!ra) return 1;
        if(!rb) return -1;
        return ra.avg-rb.avg || rb.count-ra.count || byName(a,b);
      });

    case "reviews":
      return rows.sort((a,b)=>{
        const ra=rate(a), rb=rate(b);
        const ca=ra?ra.count:0, cb=rb?rb.count:0;
        return cb-ca || (rb?rb.avg:0)-(ra?ra.avg:0) || byName(a,b);
      });

    default: return rows;   // 등록순 (DB 원래 순서)
  }
}

function renderGrid(){
  const rows = filtered();

      ${UI.q?"다른 키워드로 찾아보세요.":"우측 상단의 ＋ 새 항목으로 첫 서번트를 등록하세요."}</div>`;
    renderPager(1, 0);
    return;
  }

  // ── 페이지네이션: 현재 쪽에 해당하는 항목만 렌더 ──
  const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if(UI.page > pages) UI.page = pages;
  if(UI.page < 1) UI.page = 1;
  const start = (UI.page - 1) * PAGE_SIZE;

  $("#grid").innerHTML = pageRows.map(e=>{
    const c = colorOf(e);
    const mini = e.type==="서번트" ? STATS.map(([k,col])=>{
      const v = (e.deck&&e.deck[k])||""; if(!v) return "";
      return `<span class="set"><i class="sw" style="background:${col}"></i><span class="v">${esc(v)}</span></span>`;
    }).join("") : `<span class="v" style="color:var(--dim)">${esc(e.align||"—")}</span>`;
    const line = e.type==="서번트"
      ? (e.checks||"") + ((e.skills||[]).length?`  ·  스킬 ${e.skills.length}`:"")
      : (e.skills||[]).map(s=>s.name).join(" · ");
    return `<button class="item" style="--c:${c}" onclick="openDetail('${e.id}')">
      <div class="thumb">${e.illust?`<img src="${e.illust}" alt="" loading="lazy" decoding="async">`:`<span class="ph">◈</span>`}</div>
      <div class="meat">
        <div class="top">
          <span class="chip">${esc(e.type==="마스터"?"마스터":e.cls||"미분류")}</span>
          ${rankBadge(e.id)}
        </div>
        <div class="nm">${esc(e.name)}</div>
        <div class="mini">${mini||'<span class="v" style="color:var(--dim-2)">덱 정보 없음</span>'}</div>
        ${line?`<div class="tagline">${esc(line)}</div>`:""}
      </div></button>`;
  }).join("");

  renderPager(pages, rows.length);
}

function renderPager(pages, total){
  let el = document.getElementById("pager");
  if(!el){
    el = document.createElement("div");
    el.id = "pager"; el.className = "pager";
    $("#grid").after(el);
  }
  if(pages <= 1){ el.innerHTML = ""; return; }

  const p = UI.page;
  const btn = (label, page, o={}) =>
    `<button class="pg${o.on?" on":""}"${o.dis?" disabled":""}${page?` onclick="gotoPage(${page})"`:""}>${label}</button>`;

  // 1쪽·마지막쪽·현재쪽 주변만 숫자로, 나머지는 … 로 축약
  const list = [];
  for(let i=1;i<=pages;i++){
    if(i===1 || i===pages || (i>=p-2 && i<=p+2)) list.push(i);
    else if(list[list.length-1] !== "…") list.push("…");
  }

  el.innerHTML =
    btn("‹ 이전", p>1?p-1:0, {dis:p<=1}) +
    list.map(n => n==="…" ? `<span class="pg-gap">…</span>` : btn(n, n, {on:n===p})).join("") +
    btn("다음 ›", p<pages?p+1:0, {dis:p>=pages}) +
    `<span class="pg-info">${total.toLocaleString()}개 · ${p}/${pages}쪽</span>`;
}

    <div class="sk">

        `<span class="pill" style="--pc:${TAGCOLOR[t]||"#8496b5"}">${esc(t)}</span>`).join("")}</div>`:""}
      <div class="snm">${esc(s.name||"이름 없음")}</div>
      ${(s.cost||s.power)?`<div class="nums">
        ${s.cost!==""&&s.cost!=null?`<span class="badge" style="--bc:#3ad684"><svg><use href="#i-cost"/></svg>${esc(s.cost)}</span>`:""}
        ${s.power!==""&&s.power!=null?`<span class="badge" style="--bc:#4aa8ff"><svg><use href="#i-pow"/></svg>${esc(s.power)}</span>`:""}
      </div>`:""}
      <div class="eff">${kw(s.text)}</div>
    </div>`).join("");

  /* 궁합 — 아카이브에 있는 이름이면 클릭해서 이동 */
  const syn = (e.synergy||[]).filter(s=>s.name||s.text).map(s=>{
    const t = findByName(s.name);
    if(t && t.id!==e.id){
      return `<button class="syn" style="--lc:${colorOf(t)}" onclick="goTo('${t.id}')">
        <div class="sn">${esc(t.name)}<span class="go">${esc(roleOf(t))} ↗</span></div>
        ${s.text?`<div class="sd">${esc(s.text)}</div>`:""}</button>`;
    }
    return `<div class="syn"><div class="sn">${esc(s.name||"이름 없음")}
      ${s.name?`<span class="miss">미등록</span>
        <button class="mk" onclick="newFrom('${encodeURIComponent(s.name)}','${e.type}')">＋ 아카이브에 등록</button>`:""}</div>
      ${s.text?`<div class="sd">${esc(s.text)}</div>`:""}</div>`;
  }).join("");

  /* 역참조 — 이 항목을 궁합으로 적어둔 다른 항목 (이미 위에 나온 건 제외) */
  const listed = new Set((e.synergy||[]).map(s=>norm(s.name)).filter(Boolean));
  const backs = DB.filter(x => x.id!==e.id
      && !listed.has(norm(x.name))
      && (x.synergy||[]).some(s=>norm(s.name) === norm(e.name)));
  const backHtml = backs.map(x=>`<button class="back-chip" style="--lc:${colorOf(x)}"
      onclick="goTo('${x.id}')"><i>${esc(roleOf(x))}</i>${esc(x.name)} ↗</button>`).join("");

  $("#detail").innerHTML = `<div class="panel"><div class="panel-in" style="--c:${c}">
    <div class="banner"><span>${esc(isS?(e.cls||"미분류"):"마스터")}</span></div>
    <div class="d-head">
      <div class="d-eyebrow">${isS?"SERVANT RECORD":"MASTER RECORD"}</div>
      <div class="d-name">${esc(e.name)}</div>
      ${e.reading?`<div class="d-sub">${esc(e.reading)}</div>`:""}
    </div>
    <div class="d-body">
      <div>
        <div class="d-illust">${e.illust?`<img src="${e.illust}" alt="">`:"일러스트 없음"}</div>
        <div class="facts">
          <div class="r"><div class="k">평가</div><div class="v">${rankRow(e.id)}</div></div>
          ${e.align?`<div class="r"><div class="k">${isS?"속성":"유형"}</div><div class="v">${esc(e.align)}</div></div>`:""}
          ${e.origin?`<div class="r"><div class="k">출전</div><div class="v">${esc(e.origin)}</div></div>`:""}
          ${e.memo?`<div class="r"><div class="k">메모</div><div class="v">${esc(e.memo)}</div></div>`:""}
        </div>
      </div>
      <div>
        ${deck||checks?`<div class="sec"><div class="sec-h"><h3>덱 구성</h3><span class="t">DECK</span></div>${deck}${checks}</div>`:""}
        ${skills?`<div class="sec"><div class="sec-h"><h3>${isS?"스킬 · 보구":"능력"}</h3><span class="t">${isS?"SKILL":"ABILITY"}</span></div><div class="cards">${skills}</div></div>`:""}
        ${e.review?`<div class="sec"><div class="sec-h"><h3>총평</h3><span class="t">REVIEW</span></div><div class="prose">${esc(e.review)}</div></div>`:""}
        ${syn?`<div class="sec"><div class="sec-h"><h3>${isS?"궁합이 좋은 마스터":"궁합이 좋은 서번트"}</h3><span class="t">SYNERGY</span></div><div class="synergy">${syn}</div></div>`:""}
        ${backHtml?`<div class="sec"><div class="sec-h"><h3>여기를 언급한 항목</h3><span class="t">REFERENCED BY</span></div><div class="backs">${backHtml}</div></div>`:""}
      </div>
    </div>
    <div class="d-foot">
      ${NAV.length?`<button class="btn" onclick="goBack()">← ${esc(DB.find(x=>x.id===NAV[NAV.length-1])?.name||"뒤로")}</button>`:""}
      <button class="btn" onclick="closeDetail()">닫기</button>
      <span class="sp"></span>
      <button class="btn danger" onclick="removeEntry('${e.id}')">삭제</button>
      <button class="btn primary" onclick="closeDetail();openEditor('${e.id}')">수정</button>
    </div>
  </div></div>`;
  $("#detail").classList.add("open");
  if(window.mountReviews) window.mountReviews(e);
}
function closeDetail(){ $("#detail").classList.remove("open"); NAV=[]; CUR=null; }

/* 궁합 링크를 타고 이동 — 되돌아올 수 있게 경로를 쌓아둔다 */
function goTo(id){
  if(CUR) NAV.push(CUR);
  openDetail(id, true);
  $("#detail").scrollTop = 0;
}
function goBack(){
  const prev = NAV.pop(); if(!prev) return closeDetail();
  openDetail(prev, true);
  $("#detail").scrollTop = 0;
}
/* 아직 아카이브에 없는 궁합 상대를 바로 등록 */
function newFrom(enc, srcType){
  closeDetail();
  draft = blank();
  draft.name = decodeURIComponent(enc);
  draft.type = srcType==="서번트" ? "마스터" : "서번트";
  if(draft.type==="마스터") draft.cls = "";
  drawEditor(); $("#editor").classList.add("open");
}

async function removeEntry(id){
  const e = DB.find(x=>x.id===id);
  if(!confirm(`"${e.name}" 항목을 삭제할까요? 되돌릴 수 없습니다.`)) return;
  DB = DB.filter(x=>x.id!==id);
  await save(); closeDetail(); render(); toast("삭제했습니다");
}

/* ══════════ 편집 ══════════ */
let draft = null;

function blank(){
  return {id:uid(), type:"서번트", cls:"세이버", name:"", reading:"", tier:"", align:"", origin:"",
    illust:"", deck:{"근력":"","민첩":"","마술":""}, checks:"",
    skills:[{name:"",tags:"",cost:"",power:"",text:""}],
    synergy:[{name:"",text:""}], review:"", memo:""};
}

function openEditor(id){
  draft = id ? JSON.parse(JSON.stringify(DB.find(x=>x.id===id))) : blank();
  if(!draft.deck) draft.deck = {"근력":"","민첩":"","마술":""};
  if(!draft.skills || !draft.skills.length) draft.skills = [{name:"",tags:"",cost:"",power:"",text:""}];
  if(!draft.synergy || !draft.synergy.length) draft.synergy = [{name:"",text:""}];
  drawEditor(); $("#editor").classList.add("open");
}
function closeEditor(){ $("#editor").classList.remove("open"); draft=null; }

function setField(k,v){ draft[k]=v; drawEditor(); }
function addRow(k){ draft[k].push(k==="skills"?{name:"",tags:"",cost:"",power:"",text:""}:{name:"",text:""}); drawEditor(); }
function delRow(k,i){ draft[k].splice(i,1); if(!draft[k].length) addRow(k); else drawEditor(); }

/* 이미지: 가로 520px로 축소한 뒤 서버에 올리고, 카드에는 짧은 URL만 저장한다.
   (base64를 카드에 그대로 넣으면 저장할 때마다 DB 전체와 함께 전송되어
    요청 크기 한도를 넘고, 결국 나에게만 보이는 이미지가 된다) */
function pickImage(file){
  if(!file || !file.type.startsWith("image/")) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = async () => {
      const max = 520, sc = Math.min(1, max/img.width);
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      const dataUrl = cv.toDataURL("image/jpeg", .82);

      draft.illust = dataUrl;      // 업로드 동안 미리보기
      drawEditor();
      toast("이미지 업로드 중…");
      try{
        const url = await uploadImage(dataUrl);
        draft.illust = url;        // 공유 가능한 URL로 교체
        drawEditor();
        toast("이미지를 업로드했습니다");
      }catch(err){
        draft.illust = "";
        drawEditor();
        alert("이미지 업로드에 실패했습니다.\n" + (err && err.message ? err.message : "") +
              "\n\n이미지를 올리지 않으면 카드의 나머지 내용은 정상 저장됩니다.");
      }
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

/* 데이터 URL을 서버에 올리고 공유 가능한 주소를 돌려받는다 */
async function uploadImage(dataUrl){
  const res = await fetch("/api/image", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ data: dataUrl }),
  });
  let d = {};
  try{ d = await res.json(); }catch(e){}
  if(!res.ok || !d.url) throw new Error(d.error || `서버 오류 (${res.status})`);
  return d.url;
}

/* 예전에 base64로 박혀 있던 이미지를 URL로 옮긴다 (저장 직전 1회) */
async function migrateInlineImages(){
  const targets = DB.filter(e => typeof e.illust === "string" && e.illust.startsWith("data:"));
  if(!targets.length) return 0;
  let moved = 0;
  for(const e of targets){
    try{ e.illust = await uploadImage(e.illust); moved++; }
    catch(err){ e.illust = ""; }   // 옮기지 못하면 비워서 저장이 막히지 않게 한다
  }
  return moved;
}

async function commit(){
  if(!draft.name.trim()){ toast("이름을 입력해 주세요"); return; }
  if(draft.type==="마스터") draft.cls = "";
  draft.skills = draft.skills.filter(s=>s.name||s.text);
  draft.synergy = draft.synergy.filter(s=>s.name||s.text);
  const i = DB.findIndex(x=>x.id===draft.id);
  if(i>=0) DB[i] = draft; else DB.unshift(draft);
  const id = draft.id;
  await save(); closeEditor(); render(); toast("저장했습니다");
  openDetail(id);
}

/* ══════════ 백업 ══════════ */
function exportJSON(){
  const blob = new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "pedomi-archive.json"; a.click();
  URL.revokeObjectURL(a.href);
}
function importJSON(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try{
      const data = JSON.parse(r.result);
      if(!Array.isArray(data)) throw 0;
      const ids = new Set(DB.map(e=>e.id));
      data.forEach(e=>{ if(!e.id||ids.has(e.id)) e.id = uid(); DB.push(e); });
      await save(); render(); toast(`${data.length}개 항목을 불러왔습니다`);
    }catch(e){ toast("파일을 읽을 수 없습니다. JSON 형식을 확인해 주세요."); }
    input.value = "";
  };
  r.readAsText(f);
}
